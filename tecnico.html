<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1916;min-height:100vh;max-width:480px;margin:0 auto;position:relative}
/* HEADER */
.header{background:#e8640a;padding:16px 18px 14px;position:sticky;top:0;z-index:50}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.header h1{color:white;font-size:18px;font-weight:600;letter-spacing:-.02em}
.header-sub{color:rgba(255,255,255,.8);font-size:12px}
.badge-count{background:white;color:#e8640a;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
/* FILTERS */
.filter-bar{background:white;padding:10px 14px;display:flex;gap:6px;border-bottom:1px solid #e2e0d8;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.ftag{background:#f0efe9;border:1px solid #e2e0d8;border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap;cursor:pointer;color:#6b6860}
.ftag.active{background:#e8640a;color:white;border-color:#e8640a}
.ftag.urg.active{background:#8b1a1a;border-color:#8b1a1a}
.ftag.and.active{background:#7a4010;border-color:#7a4010}
.ftag.con.active{background:#3b6d11;border-color:#3b6d11}
/* LISTA */
.lista{padding:12px 14px;display:flex;flex-direction:column;gap:10px;padding-bottom:30px}
.os-card{background:white;border-radius:12px;padding:14px 16px;border-left:4px solid #e2e0d8;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;active:opacity:.9}
.os-card:active{opacity:.85}
.os-card.urgente{border-left-color:#e24b4a}
.os-card.normal{border-left-color:#e0891a}
.os-card.baixa{border-left-color:#639922}
.os-num{font-size:11px;color:#9e9b94;font-family:monospace;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.os-client{font-size:16px;font-weight:700;margin-bottom:3px;text-transform:uppercase}
.os-addr{font-size:12px;color:#6b6860;margin-bottom:8px;display:flex;align-items:flex-start;gap:4px}
.os-footer{display:flex;align-items:center;justify-content:space-between}
.os-type{font-size:11px;background:#f0efe9;border-radius:5px;padding:3px 8px;color:#6b6860}
.os-date{font-size:11px;color:#9e9b94;font-family:monospace}
.status-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px}
.sb-aberto{background:#dce8f5;color:#1e3a5f}
.sb-andamento{background:#faecd8;color:#7a4010}
.sb-concluido{background:#d8eece;color:#2d5a3d}
.empty{text-align:center;padding:60px 20px;color:#9e9b94}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
/* DETALHE */
.detail-view{display:none;position:fixed;inset:0;background:#f5f4f0;z-index:100;overflow-y:auto;max-width:480px;margin:0 auto}
.detail-view.open{display:block}
.detail-header{background:#e8640a;padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.back-btn{background:rgba(255,255,255,.2);border:none;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;font-size:18px;flex-shrink:0}
.detail-header h2{color:white;font-size:16px;font-weight:600;flex:1}
.detail-body{padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.info-card{background:white;border-radius:12px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.info-card h3{font-size:11px;font-weight:600;color:#9e9b94;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.info-row{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.info-row:last-child{margin-bottom:0}
.info-label{font-size:11px;color:#9e9b94;text-transform:uppercase;letter-spacing:.03em}
.info-value{font-size:14px;color:#1a1916;font-weight:500;line-height:1.4}
.info-value.pre{white-space:pre-line;font-size:13px;font-weight:400}
/* AÇÕES */
.actions{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.btn-full{width:100%;padding:16px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:-apple-system,sans-serif}
.btn-andamento{background:#faecd8;color:#7a4010}
.btn-andamento:active{background:#f5d8b0}
.btn-concluir{background:#e8640a;color:white}
.btn-concluir:active{background:#c4540a}
.btn-maps{background:#f0efe9;color:#1a1916;border:1px solid #e2e0d8}
.btn-maps:active{background:#e2e0d8}
.btn-sec-full{background:none;border:1px solid #e2e0d8;border-radius:12px;padding:14px;font-size:14px;color:#6b6860;cursor:pointer;width:100%;font-family:-apple-system,sans-serif}
/* EXECUÇÃO */
.exec-sheet{display:none;position:fixed;inset:0;z-index:200;max-width:480px;margin:0 auto}
.exec-sheet.open{display:block}
.exec-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.exec-panel{position:absolute;bottom:0;left:0;right:0;background:white;border-radius:20px 20px 0 0;padding:20px 18px;max-height:90vh;overflow-y:auto}
.exec-handle{width:40px;height:4px;background:#e2e0d8;border-radius:2px;margin:0 auto 16px}
.exec-panel h3{font-size:16px;font-weight:600;margin-bottom:14px}
textarea.exec-input{width:100%;border:1px solid #e2e0d8;border-radius:10px;padding:12px;font-size:14px;font-family:-apple-system,sans-serif;line-height:1.5;min-height:100px;resize:none;outline:none;text-transform:uppercase}
textarea.exec-input:focus{border-color:#e8640a}
.fotos-area{margin-top:12px}
.fotos-label{font-size:12px;font-weight:600;color:#6b6860;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.fotos-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.foto-prev-img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.btn-foto{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#f0efe9;border:1px dashed #ccc9be;border-radius:10px;font-size:14px;color:#6b6860;cursor:pointer;font-family:-apple-system,sans-serif}
.btn-foto:active{background:#e2e0d8}
.btn-salvar-exec{background:#e8640a;color:white;width:100%;padding:16px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;font-family:-apple-system,sans-serif}
.btn-salvar-exec:active{background:#c4540a}
/* LOADING */
.loading{text-align:center;padding:40px;color:#9e9b94;font-size:14px}
.spinner{width:32px;height:32px;border:3px solid #e2e0d8;border-top-color:#e8640a;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1916;color:white;padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* PRIO colors */
.prio-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.prio-urg{background:#e24b4a}
.prio-nor{background:#e0891a}
.prio-bai{background:#639922}
/* NOTIFICAÇÃO */
.notif{position:fixed;top:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;z-index:999;pointer-events:none}
.notif-bar{background:#1a1916;color:white;padding:14px 18px;display:flex;align-items:center;gap:12px;transform:translateY(-100%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);pointer-events:all}
.notif-bar.show{transform:translateY(0)}
.notif-icon{width:38px;height:38px;background:#e8640a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.notif-text{flex:1}
.notif-title{font-size:13px;font-weight:600}
.notif-sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:1px}
.notif-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:18px;cursor:pointer;padding:4px}
.notif-close:hover{color:white}
/* BADGE NOVO */
.badge-new{background:#e24b4a;color:white;border-radius:999px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:6px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
</style>
</head>

<script>
const SUPABASE_URL = "https://phvegvllwgyxmypglxie.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBodmVndmxsd2d5eG15cGdseGllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjM2MTgsImV4cCI6MjA5NDkzOTYxOH0._VNfn_UfUy6Rml1OFSy2dYMPw0FVTE3oUIlDUgXtg1E";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TICON={"Instalação":"⚡","Manutenção":"🔧","Limpeza":"🧹","Vistoria":"🔍","Orçamento":"📋","Outros":"📌"};
let DB=[], filtro="todos", viewId=null, fotosNovas=[];

function fD(d){if(!d)return"—";if(d.includes("T"))d=d.split("T")[0];const p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function fDT(d,t){let s=fD(d);if(t)s+=" às "+t.slice(0,5);return s}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}

async function loadOS(){
  document.getElementById("lista").innerHTML='<div class="loading"><div class="spinner"></div>Carregando...</div>';
  const {data,error}=await sb.from("chamados").select("*").neq("status","arquivado").order("data_criacao",{ascending:false});
  if(!error&&data) DB=data;
  renderLista();
}

function setFiltro(f,btn){
  filtro=f;
  document.querySelectorAll(".ftag").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  renderLista();
}

function renderLista(){
  const lista=filtro==="todos"?DB:DB.filter(c=>c.status===filtro);
  document.getElementById("badge-count").textContent=lista.length;
  const el=document.getElementById("lista");
  if(!lista.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>'+(filtro==="todos"?"Nenhuma OS ainda":"Nenhuma OS com esse status")+'</p></div>';
    return;
  }
  el.innerHTML=lista.map((c,i)=>{
    const prio=c.prioridade||"normal";
    const statusHtml=`<span class="status-badge sb-${c.status}">${c.status==="aberto"?"Aberto":c.status==="andamento"?"Em andamento":"Concluído"}</span>`;
    return`<div class="os-card ${prio}" onclick="abrirOS('${c.id}')">
      <div class="os-num">
        <span>#${String(i+1).padStart(3,"0")} · ${TICON[c.tipo]||"📌"} ${c.tipo}</span>
        ${statusHtml}
      </div>
      <div class="os-client">${c.cliente_nome}</div>
      <div class="os-addr">📍 ${c.endereco||"—"}</div>
      <div class="os-footer">
        <span class="os-date">${c.data_agendada?fDT(c.data_agendada,c.hora_agendada):"Sem agendamento"}</span>
        <div class="prio-dot prio-${prio==="urgente"?"urg":prio==="normal"?"nor":"bai"}"></div>
      </div>
    </div>`;
  }).join("");
}

async function abrirOS(id){
  viewId=id;
  const c=DB.find(x=>x.id===id);
  const i=DB.indexOf(c);
  document.getElementById("detail-num").textContent="OS #"+String(i+1).padStart(3,"0");
  const sbEl=document.getElementById("detail-status-badge");
  sbEl.className="status-badge sb-"+c.status;
  sbEl.textContent=c.status==="aberto"?"Aberto":c.status==="andamento"?"Em andamento":"Concluído";
  const maps=(c.lat&&c.lng)?"https://www.google.com/maps?q="+c.lat+","+c.lng:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(c.endereco||"");
  // Fotos
  const {data:fotos}=await sb.from("fotos").select("*").eq("chamado_id",id);
  const fotosHtml=(fotos&&fotos.length)?`<div class="info-row"><div class="info-label">Fotos registradas</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px">${fotos.map(f=>`<img src="${f.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px" onclick="window.open('${f.url}','_blank')">`).join("")}</div></div>`:"";
  document.getElementById("detail-body").innerHTML=`
    <div class="info-card">
      <h3>Cliente</h3>
      <div class="info-row"><div class="info-label">Nome</div><div class="info-value">${c.cliente_nome}</div></div>
      <div class="info-row"><div class="info-label">Endereço</div><div class="info-value">${c.endereco||"—"}</div></div>
      ${c.data_agendada?`<div class="info-row"><div class="info-label">Agendado</div><div class="info-value">${fDT(c.data_agendada,c.hora_agendada)}</div></div>`:""}
    </div>
    <div class="info-card">
      <h3>Serviço</h3>
      <div class="info-row"><div class="info-label">Tipo</div><div class="info-value">${TICON[c.tipo]||""} ${c.tipo}</div></div>
      <div class="info-row"><div class="info-label">Prioridade</div><div class="info-value">${c.prioridade==="urgente"?"🔴 Urgente":c.prioridade==="normal"?"🟡 Normal":"🟢 Baixa"}</div></div>
      <div class="info-row"><div class="info-label">Descrição</div><div class="info-value pre">${c.descricao||"—"}</div></div>
      ${c.materiais?`<div class="info-row"><div class="info-label">Materiais previstos</div><div class="info-value pre">${c.materiais}</div></div>`:""}
    </div>
    ${c.execucao?`<div class="info-card"><h3>Execução registrada</h3><div class="info-row"><div class="info-value pre">${c.execucao}</div></div>${fotosHtml}</div>`:(fotos&&fotos.length?`<div class="info-card"><h3>Fotos</h3>${fotosHtml}</div>`:"")}
  `;
  // Ações conforme status
  const actions=document.getElementById("detail-actions");
  actions.innerHTML=`<button class="btn-full btn-maps" onclick="window.open('${maps}','_blank')">🗺️ Ver no mapa</button>`;
  if(c.status==="aberto"){
    actions.innerHTML+=`<button class="btn-full btn-andamento" onclick="mudarStatus('andamento')">▶ Iniciar atendimento</button>`;
  }
  if(c.status==="andamento"){
    actions.innerHTML+=`<button class="btn-full btn-concluir" onclick="abrirExec()">✓ Registrar e concluir</button>`;
  }
  if(c.status==="concluido"){
    actions.innerHTML+=`<button class="btn-full" style="background:#d8eece;color:#2d5a3d" onclick="abrirExec()">✏️ Editar execução</button>`;
  }
  document.getElementById("detail-view").classList.add("open");
  window.scrollTo(0,0);
}

function voltarLista(){
  document.getElementById("detail-view").classList.remove("open");
  // REALTIME — notificar quando OS nova chegar
let osIds = new Set();
let realtimeIniciado = false;

function iniciarRealtime(){
  if(realtimeIniciado) return;
  realtimeIniciado = true;
  sb.channel("chamados-novos")
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "chamados"
    }, (payload) => {
      const nova = payload.new;
      // Vibrar no celular
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      // Som de notificação
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(880,ctx.currentTime);
        osc.frequency.setValueAtTime(1100,ctx.currentTime+0.1);
        gain.gain.setValueAtTime(0.3,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.4);
        osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.4);
      }catch(e){}
      // Mostrar notificação
      mostrarNotif(nova);
      // Recarregar lista
      loadOS();
    })
    .subscribe();
}

function mostrarNotif(os){
  const bar = document.getElementById("notif-bar");
  document.getElementById("notif-title").textContent = "🆕 Nova OS — " + os.cliente_nome;
  document.getElementById("notif-sub").textContent = (os.tipo||"") + " · " + (os.endereco||"");
  bar.classList.add("show");
  // Auto fechar após 6s
  setTimeout(()=>fecharNotif(), 6000);
  // Clicar abre a OS
  bar.onclick = ()=>{ fecharNotif(); loadOS(); setTimeout(()=>abrirOS(os.id),400); };
}

function fecharNotif(){
  document.getElementById("notif-bar").classList.remove("show");
}

loadOS();
iniciarRealtime();
}

async function mudarStatus(status){
  await sb.from("chamados").update({status}).eq("id",viewId);
  const c=DB.find(x=>x.id===viewId);
  if(c)c.status=status;
  showToast(status==="andamento"?"▶ Atendimento iniciado!":"✓ Concluído!");
  abrirOS(viewId);
}

function abrirExec(){
  const c=DB.find(x=>x.id===viewId);
  document.getElementById("exec-text").value=c?.execucao||"";
  fotosNovas=[];
  document.getElementById("fotos-preview").innerHTML="";
  document.getElementById("exec-sheet").classList.add("open");
}
function fecharExec(){document.getElementById("exec-sheet").classList.remove("open")}

function selecionarFotos(input){
  const files=Array.from(input.files);
  fotosNovas=[...fotosNovas,...files];
  const preview=document.getElementById("fotos-preview");
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=document.createElement("img");
      img.className="foto-prev-img";img.src=e.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(f);
  });
}

async function salvarExec(){
  const exec=document.getElementById("exec-text").value.trim();
  showToast("Salvando...");
  await sb.from("chamados").update({execucao:exec,status:"concluido"}).eq("id",viewId);
  for(const file of fotosNovas){
    const ext=file.name.split(".").pop()||"jpg";
    const path=`${viewId}/${Date.now()}.${ext}`;
    const {data:up}=await sb.storage.from("fotos-os").upload(path,file,{upsert:true});
    if(up){
      const {data:url}=sb.storage.from("fotos-os").getPublicUrl(path);
      await sb.from("fotos").insert({chamado_id:viewId,url:url.publicUrl,nome:file.name});
    }
  }
  fotosNovas=[];
  fecharExec();
  showToast("✓ OS concluída com sucesso!");
  setTimeout(()=>{voltarLista()},1000);
}
