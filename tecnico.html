<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8640a">
<title>EU Gerador — Técnico</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f0efe9;color:#1a1916;min-height:100vh}

.topbar{background:#fff;border-bottom:1px solid #e2e0d8;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-logo{font-size:15px;font-weight:600;color:#e8640a;letter-spacing:-.02em}
.topbar-sub{font-size:11px;color:#9e9b94}
.pill-status{display:flex;align-items:center;gap:4px;background:#f0efe9;border:1px solid #e2e0d8;border-radius:999px;padding:3px 9px;font-size:11px;color:#6b6860}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.lista-wrap{padding:12px}
.section-title{font-size:11px;font-weight:600;color:#9e9b94;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px 2px}
.os-card{background:#fff;border:1px solid #e2e0d8;border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s;border-left-width:3px}
.os-card:active{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.os-card.urgente{border-left-color:#c0392b}
.os-card.normal{border-left-color:#e8640a}
.os-card.baixa{border-left-color:#3b6d11}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.card-num{font-size:10px;font-family:'DM Mono',monospace;color:#9e9b94}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px}
.badge-urg{background:#fdeaea;color:#8b1a1a}
.badge-nor{background:#fef3dc;color:#7a4010}
.badge-bai{background:#e8f5dc;color:#3b6d11}
.badge-tipo{background:#f0efe9;color:#6b6860}
.badge-and{background:#faecd8;color:#7a4010}
.badge-con{background:#d8eece;color:#2d5a3d}
.card-client{font-size:14px;font-weight:600;color:#1a1916;margin-bottom:2px}
.card-addr{font-size:12px;color:#6b6860;margin-bottom:6px}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.card-date{font-size:11px;color:#9e9b94;font-family:'DM Mono',monospace}
.card-wa{width:28px;height:28px;border-radius:6px;background:#e8f5e9;border:1px solid #a5d6a7;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty{text-align:center;padding:60px 20px;color:#9e9b94;font-size:14px}
.loading{text-align:center;padding:60px 20px;color:#9e9b94;font-size:13px}

.detail-wrap{display:none;flex-direction:column;min-height:100vh}
.detail-header{background:#fff;border-bottom:1px solid #e2e0d8;padding:0 16px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.btn-back{background:none;border:none;font-size:22px;cursor:pointer;color:#6b6860;padding:4px;line-height:1;flex-shrink:0}
.detail-title{font-size:15px;font-weight:600;flex:1}
.detail-body{padding:14px;flex:1}

.info-card{background:#fff;border:1px solid #e2e0d8;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.slbl{font-size:10px;font-weight:600;color:#9e9b94;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.irow{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;font-size:13px;color:#1a1916;line-height:1.5}
.irow:last-child{margin-bottom:0}
.irow .ic{flex-shrink:0;color:#9e9b94;margin-top:1px;font-size:15px}
.desc-box{background:#f0efe9;border:1px solid #e2e0d8;border-radius:6px;padding:9px 11px;font-size:13px;color:#6b6860;line-height:1.6;white-space:pre-wrap}

.acoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.abtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 8px;border-radius:10px;border:1px solid transparent;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:opacity .15s;background:#fff}
.abtn:active{opacity:.7}
.abtn svg{width:22px;height:22px}
.abtn.wpp{color:#1a7f4b;border-color:#9FE1CB;background:#f0fdf7}
.abtn.mapa{color:#185FA5;border-color:#B5D4F4;background:#EBF4FD}
.abtn.reagendar{color:#BA7517;border-color:#FAC775;background:#FEF7EC}
.abtn.comentar{color:#534AB7;border-color:#CECBF6;background:#F2F1FE}

.expand{display:none;margin-top:6px;background:#fff;border:1px solid #e2e0d8;border-radius:10px;padding:12px 14px}
.expand.open{display:block}
.expand label{font-size:11px;font-weight:600;color:#6b6860;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px}
.expand input[type=datetime-local],.expand textarea{width:100%;border:1px solid #ccc9be;border-radius:6px;padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;color:#1a1916;background:#fff;outline:none}
.expand textarea{min-height:80px;resize:none;line-height:1.5}
.expand .sbtn{margin-top:8px;width:100%;padding:11px;border-radius:7px;border:none;background:#1a1916;color:#fff;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer}
.expand .sbtn:active{opacity:.85}

.btn-main{width:100%;padding:14px;border-radius:10px;border:none;background:#e8640a;color:#fff;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.btn-main:active{opacity:.88}
.btn-main.verde{background:#3b6d11}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1916;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LISTA -->
<div id="v-lista">
  <div class="topbar">
    <div>
      <div class="topbar-logo">EU Gerador</div>
      <div class="topbar-sub" id="tec-nome">...</div>
    </div>
    <div class="pill-status">
      <div class="dot" style="background:#25D366"></div>
      <span id="tec-status">Online</span>
    </div>
  </div>
  <div class="lista-wrap">
    <div id="lista"><div class="loading">Carregando...</div></div>
  </div>
</div>

<!-- DETALHE -->
<div id="v-detalhe" class="detail-wrap">
  <div class="detail-header">
    <button class="btn-back" onclick="voltarLista()">‹</button>
    <div class="detail-title" id="d-titulo">OS #000</div>
    <div id="d-badge"></div>
  </div>
  <div class="detail-body">

    <div class="info-card">
      <div class="slbl">Cliente</div>
      <div class="irow"><span class="ic">👤</span><span id="d-cliente"></span></div>
      <div class="irow"><span class="ic">📞</span><span id="d-tel"></span></div>
    </div>

    <div class="info-card">
      <div class="slbl">Agendamento</div>
      <div class="irow"><span class="ic">📅</span><span id="d-data"></span></div>
      <div class="irow"><span class="ic">📍</span><span id="d-end"></span></div>
      <div class="irow"><span class="ic">🔧</span><span id="d-tipo"></span></div>
    </div>

    <div class="info-card">
      <div class="slbl">Descrição</div>
      <div class="desc-box" id="d-desc"></div>
    </div>

    <div class="info-card">
      <div class="slbl">Ações rápidas</div>
      <div class="acoes-grid">

        <button class="abtn wpp" onclick="abrirWA()">
          <svg viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WhatsApp
        </button>

        <button class="abtn mapa" onclick="abrirMapa()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          Ver no mapa
        </button>

        <button class="abtn reagendar" onclick="toggle('e-reagendar')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Reagendar
        </button>

        <button class="abtn comentar" onclick="toggle('e-comentar')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Comentário
        </button>
      </div>

      <div class="expand" id="e-reagendar">
        <label>Nova data e hora</label>
        <input type="datetime-local" id="i-data">
        <button class="sbtn" onclick="salvarReagendar()">Confirmar reagendamento</button>
      </div>

      <div class="expand" id="e-comentar">
        <label>Comentário</label>
        <textarea id="i-coment" placeholder="Escreva uma observação sobre esta OS..."></textarea>
        <button class="sbtn" onclick="salvarComentario()">Salvar comentário</button>
      </div>
    </div>

    <button class="btn-main" id="btn-acao" onclick="acaoPrincipal()">
      ▶ Iniciar atendimento
    </button>

  </div>
</div>

<script>
const SUPABASE_URL = "https://phvegvllwgyxmypglxie.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBodmVndmxsd2d5eG15cGdseGllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjM2MTgsImV4cCI6MjA5NDkzOTYxOH0._VNfn_UfUy6Rml1OFSy2dYMPw0FVTE3oUIlDUgXtg1E";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TECNICOS = {
  DF: { nome:"Diego Fernandes", tel:"5518996812807" },
  KH: { nome:"Kayk Henrique",   tel:"5518991208901" }
};
const p = new URLSearchParams(location.search);
const TEC = TECNICOS[(p.get("tec")||"DF").toUpperCase()] || TECNICOS.DF;
document.getElementById("tec-nome").textContent = TEC.nome;

const PBCLS = { urgente:"badge-urg", normal:"badge-nor", baixa:"badge-bai" };
const PLBL  = { urgente:"Urgente", normal:"Normal", baixa:"Baixa" };
const TICO  = { "Instalação":"⚡","Manutenção":"🔧","Limpeza":"🧹","Vistoria":"🔍","Orçamento":"📋","Outros":"📌" };

let DB = [], OS = null;

function fDT(d,t){ if(!d)return"—"; const p=d.split("-"); let s=p[2]+"/"+p[1]+"/"+p[0]; if(t)s+=" às "+t.slice(0,5); return s; }
function ix(id){ const i=DB.findIndex(c=>c.id===id); return String(i>=0?i+1:0).padStart(3,"0"); }

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }

async function loadOS(){
  const {data,error}=await sb.from("chamados").select("*").in("status",["aberto","andamento"]).order("data_agendada",{ascending:true,nullsFirst:false});
  if(error){ console.error("Erro ao carregar OS:",error); document.getElementById("lista").innerHTML='<div class="empty">Erro ao carregar. Verifique sua conexão.</div>'; return; }
  const chamados = data||[];
  // Busca telefones dos clientes separadamente
  const idsClientes = [...new Set(chamados.filter(c=>c.cliente_id).map(c=>c.cliente_id))];
  let telMap = {};
  if(idsClientes.length){
    const {data:clientes}=await sb.from("clientes").select("id,telefone").in("id",idsClientes);
    if(clientes) clientes.forEach(c=>{ telMap[c.id]=c.telefone||""; });
  }
  DB = chamados.map(c=>({...c, _tel: telMap[c.cliente_id]||""}));
  renderLista();
}

function renderLista(){
  const el=document.getElementById("lista");
  if(!DB.length){ el.innerHTML='<div class="empty">Nenhuma OS aberta 🎉<br><small>Tudo em dia!</small></div>'; return; }
  const and=DB.filter(c=>c.status==="andamento");
  const ab=DB.filter(c=>c.status==="aberto");
  let h="";
  if(and.length){ h+=`<div class="section-title">Em andamento</div>`+and.map(cardH).join(""); }
  if(ab.length){ h+=`<div class="section-title" style="margin-top:${and.length?14:0}px">Aguardando</div>`+ab.map(cardH).join(""); }
  el.innerHTML=h;
}

function waIco(){ return `<svg width="15" height="15" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`; }

function cardH(c){
  const tel=c._tel||"";
  const telEsc=tel.replace(/'/g,"");
  return `<div class="os-card ${c.prioridade}" onclick="abrirDetalhe('${c.id}')">
    <div class="card-top">
      <span class="card-num">#${ix(c.id)}</span>
      <div class="card-badges">
        ${c.status==="andamento"?'<span class="badge badge-and">Em andamento</span>':""}
        <span class="badge ${PBCLS[c.prioridade]}">${PLBL[c.prioridade]}</span>
        <span class="badge badge-tipo">${TICO[c.tipo]||"📌"} ${c.tipo}</span>
      </div>
    </div>
    <div class="card-client">${c.cliente_nome}</div>
    <div class="card-addr">📍 ${c.endereco||"—"}</div>
    <div class="card-footer">
      <span class="card-date">${c.data_agendada?"📅 "+fDT(c.data_agendada,c.hora_agendada):""}</span>
      ${tel?`<div class="card-wa" onclick="event.stopPropagation();waDireto('${telEsc}')">${waIco()}</div>`:""}
    </div>
  </div>`;
}

function abrirDetalhe(id){
  OS=DB.find(c=>c.id===id); if(!OS)return;
  const c=OS;
  document.getElementById("d-titulo").textContent="OS #"+ix(c.id);
  const b=document.getElementById("d-badge");
  b.innerHTML=c.status==="andamento"?'<span class="badge badge-and">Em andamento</span>':`<span class="badge ${PBCLS[c.prioridade]}">${PLBL[c.prioridade]}</span>`;
  document.getElementById("d-cliente").textContent=c.cliente_nome;
  document.getElementById("d-tel").textContent=c._tel||"—";
  document.getElementById("d-data").textContent=fDT(c.data_agendada,c.hora_agendada);
  document.getElementById("d-end").textContent=c.endereco||"—";
  document.getElementById("d-tipo").textContent=`${TICO[c.tipo]||"📌"} ${c.tipo} · ${PLBL[c.prioridade]}`;
  document.getElementById("d-desc").textContent=c.descricao||"—";
  const btn=document.getElementById("btn-acao");
  if(c.status==="andamento"){ btn.textContent="✓ Concluir atendimento"; btn.className="btn-main verde"; }
  else{ btn.textContent="▶ Iniciar atendimento"; btn.className="btn-main"; }
  document.querySelectorAll(".expand").forEach(e=>e.classList.remove("open"));
  document.getElementById("i-coment").value="";
  document.getElementById("i-data").value="";
  document.getElementById("v-lista").style.display="none";
  document.getElementById("v-detalhe").style.display="flex";
  window.scrollTo(0,0);
}

function voltarLista(){
  document.getElementById("v-detalhe").style.display="none";
  document.getElementById("v-lista").style.display="block";
  OS=null; loadOS();
}

function toggle(id){
  const a=document.getElementById(id);
  const wasOpen=a.classList.contains("open");
  document.querySelectorAll(".expand").forEach(e=>e.classList.remove("open"));
  if(!wasOpen) a.classList.add("open");
}


function abrirWA(){
  if(!OS)return;
  const tel=(OS._tel||"").replace(/\D/g,"");
  if(!tel){ toast("Telefone não cadastrado"); return; }
  window.open("https://wa.me/"+tel,"_blank");
}

function waDireto(tel){
  if(!tel){ toast("Telefone não cadastrado"); return; }
  window.open("https://wa.me/"+tel.replace(/\D/g,""),"_blank");
}

function abrirMapa(){
  if(!OS)return;
  if(OS.lat&&OS.lng) window.open(`https://www.google.com/maps?q=${OS.lat},${OS.lng}`,"_blank");
  else if(OS.endereco) window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(OS.endereco)}`,"_blank");
  else toast("Endereço não disponível");
}

async function salvarReagendar(){
  const val=document.getElementById("i-data").value;
  if(!val||!OS){ toast("Selecione a nova data"); return; }
  const novaData=val.split("T")[0];
  const novaHora=val.split("T")[1];
  const {error}=await sb.from("chamados").update({data_agendada:novaData,hora_agendada:novaHora}).eq("id",OS.id);
  if(error){ toast("Erro ao reagendar"); return; }
  OS.data_agendada=novaData; OS.hora_agendada=novaHora;
  document.getElementById("d-data").textContent=fDT(novaData,novaHora);
  document.getElementById("e-reagendar").classList.remove("open");
  document.getElementById("i-data").value="";
  toast("✓ Reagendado!");
}

async function salvarComentario(){
  const txt=document.getElementById("i-coment").value.trim();
  if(!txt||!OS){ toast("Escreva um comentário"); return; }
  const ts=new Date().toLocaleString("pt-BR");
  const ant=OS.comentarios||"";
  const novo=ant?(ant+"\n\n["+ts+" – "+TEC.nome+"]\n"+txt):("["+ts+" – "+TEC.nome+"]\n"+txt);
  const {error}=await sb.from("chamados").update({comentarios:novo}).eq("id",OS.id);
  if(error){ toast("Erro ao salvar"); return; }
  OS.comentarios=novo;
  document.getElementById("e-comentar").classList.remove("open");
  document.getElementById("i-coment").value="";
  toast("✓ Comentário salvo!");
}

async function acaoPrincipal(){
  if(!OS)return;
  if(OS.status==="aberto"){
    const {error}=await sb.from("chamados").update({status:"andamento"}).eq("id",OS.id);
    if(error){ toast("Erro ao iniciar"); return; }
    OS.status="andamento";
    document.getElementById("btn-acao").textContent="✓ Concluir atendimento";
    document.getElementById("btn-acao").className="btn-main verde";
    document.getElementById("d-badge").innerHTML='<span class="badge badge-and">Em andamento</span>';
    toast("✓ Atendimento iniciado!");
  } else {
    const hoje=new Date().toISOString().split("T")[0];
    const {error}=await sb.from("chamados").update({status:"concluido",data_conclusao:hoje}).eq("id",OS.id);
    if(error){ toast("Erro ao concluir"); return; }
    toast("✓ OS concluída!");
    setTimeout(()=>voltarLista(),1200);
  }
}

loadOS();
</script>
</body>
</html>
